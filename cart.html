<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик | Archive Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-5">🛒 Кошик</h1>

    <div class="row g-5">

        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Ваші товари</h4>
                </div>

                <div class="card-body">

                    <div id="cart-items" class="row g-4">
                    </div>

                    <hr>

                    <h3 class="text-end">
                        Загальна сума:
                        <span id="total">0</span> ₴
                    </h3>

                    <button class="btn btn-dark w-100 mt-3" onclick="очиститиКошик()">
    🗑 Очистити кошик
</button>

                    <a href="index.html" class="back-shop">
    ← Повернутися до магазину
</a>

                </div>

            </div>

        </div>

    
        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">📋 Оформлення замовлення</h4>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Ім'я</label>
                        <input type="text" class="form-control" placeholder="Ваше ім'я">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="tel" class="form-control" placeholder="+380 XX XXX XX XX">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="example@gmail.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Адреса доставки</label>
                        <textarea class="form-control" rows="3" placeholder="Місто, відділення Нової Пошти або адреса"></textarea>
                    </div>

                    <label class="form-label">Спосіб оплати</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="payment" id="cash" checked>
                        <label class="form-check-label" for="cash">
                            💵 Готівкою при отриманні
                        </label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="payment" id="card">
                        <label class="form-check-label" for="card">
                            💳 Банківською карткою
                        </label>
                    </div>

                    <button class="btn btn-success btn-lg w-100" onclick="оформити()">
                        ✔ Оформити замовлення
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="cart.js"></script>

</body>
</html>
