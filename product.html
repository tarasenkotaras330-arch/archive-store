<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Товар | Archive Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            Archive Store
        </a>

        <a href="cart.html" class="btn btn-outline-light">
            🛒 Кошик
        </a>
    </div>
</nav>


<section class="container py-5">


    <a href="index.html" class="back-catalog">
    ← Повернутися до каталогу
</a>

    <div class="row align-items-center">

        <div class="col-lg-7">

            <img id="product-image"
            class="img-fluid rounded"
            style="width:100%; height:600px; object-fit:contain; background:#f5f5f5;">

        </div>

        <div class="col-lg-5">

            <h1 id="product-name" class="fw-bold"></h1>

            <h2 id="product-price" class="my-4"></h2>


            <h5>Розмір:</h5>

            <div id="sizes" class="d-flex gap-2 mb-4">
                
            </div>


            <button class="btn btn-dark btn-lg w-100"
            id="buy-button">
                Купити
            </button>

        </div>

    </div>

</section>


<script src="product.js"></script>

<div id="toast" class="toast-message">
    ✔ Товар успішно додано до кошика
</div>

</body>
</html>
